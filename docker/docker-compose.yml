include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # Go API also serves POST /api/v1/mcp on 9380; the optional listener is separate.

    command:
      - --enable-adminserver
      - --init-superuser
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      # Bind direct API/Admin ports to localhost only so LAN users cannot bypass Nginx RBAC
      - 127.0.0.1:${SVR_HTTP_PORT}:9380
      - 127.0.0.1:${ADMIN_SVR_HTTP_PORT}:9381
      # - 0.0.0.0:${SVR_MCP_PORT}:${RAGFLOW_MCP_PORT:-9382}
    volumes:
      - ragflow_logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./u8-guide:/ragflow/web/u8-guide:ro
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      # - ./entrypoint.sh:/ragflow/entrypoint.sh
      # - ${RAGFLOW_SSH_KNOWN_HOSTS:-${HOME}/.ssh/known_hosts}:${SSH_KNOWN_HOSTS:-/etc/ragflow/ssh_known_hosts}:ro
    env_file: .env
    # Route the Go services' cache/queue backend to the separate Kvrocks service.
    # The Python services use the Valkey `redis` service, which the Go deployment
    # disables (see the `redis` profile override above). KVROCKS_HOST/KVROCKS_PORT
    # are the IN-NETWORK coordinates the Go process uses to reach `kvrocks:6379`; the
    # host-published port is KVROCKS_PORT (see docker-compose-base.yml), which CI
    # offsets per job and keeps distinct from REDIS_PORT.
    environment:
      - KVROCKS_HOST=kvrocks
      - KVROCKS_PORT=6379
      - GOMEMLIMIT=1500MiB
      - GOGC=50
      # Allow self-hosted private-network MCP servers (e.g., http://u8-db:9395/mcp) and LAN U8 SQL Server
      - ALLOW_ANY_HOST=1
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  u8-rbac:
    image: python:3.12-alpine
    command: ["python3", "/app/server.py"]
    environment:
      - RBAC_PORT=9390
      - RAGFLOW_API_URL=http://ragflow-cpu:9380
      - U8_TEAM_OWNER=caiaijun@u8.local
      - U8_TEAM_ADMINS=${U8_TEAM_ADMINS:-}
      - RBAC_DB_PATH=/data/rbac.db
    volumes:
      - ./u8-rbac/server.py:/app/server.py:ro
      - u8_rbac_data:/data
    mem_limit: 128m
    networks:
      - ragflow
    restart: unless-stopped

  u8-db:
    build:
      context: ./u8-db
      dockerfile: Dockerfile
    image: u8flow/u8-db:latest
    depends_on:
      - u8-rbac
    environment:
      - U8_DB_PORT=9395
      - U8_RBAC_API_URL=http://u8-rbac:9390
      - U8_DB_DATA_PATH=/data/u8_db.db
      - U8_DB_SECRET_PATH=/data/.secret_key
      - U8_DB_MCP_URL=http://u8-db:9395/mcp
      - U8_DB_MCP_NAME=u8_database_readonly
    volumes:
      - u8_db_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    networks:
      - ragflow
    restart: unless-stopped

volumes:
  ragflow_logs:
    driver: local
  u8_rbac_data:
    driver: local
  u8_db_data:
    driver: local

